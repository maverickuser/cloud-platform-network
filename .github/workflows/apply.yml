name: Network
# Reusable: any repository's deployment calls this first. Terraform apply is
# idempotent, so the first call creates the network and later calls change nothing.
on:
  workflow_call:
    inputs:
      network_ref:
        description: Tag or commit of cloud-platform-network to apply; keep equal to the ref in `uses:`
        type: string
        default: v1
      aws_region:
        type: string
        default: ap-south-1
      apply:
        description: Apply the plan; false stops after planning
        type: boolean
        default: true
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true
    outputs:
      state_bucket:
        description: Bucket holding the network Terraform state
        value: ${{ jobs.network.outputs.state_bucket }}
      state_key:
        description: Object key of the network Terraform state
        value: ${{ jobs.network.outputs.state_key }}
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan; unchecked stops after planning
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  network:
    name: Plan and apply shared network
    runs-on: ubuntu-24.04
    # Callers from different repositories must not create the state bucket or apply at once.
    # Not named shared-network: a caller holding that group would wait on itself.
    concurrency:
      group: cloud-platform-network-apply
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ inputs.aws_region || 'ap-south-1' }}
      STATE_BUCKET: cloud-platform-network-terraform-state
      STATE_KEY: network/terraform.tfstate
    outputs:
      state_bucket: ${{ env.STATE_BUCKET }}
      state_key: ${{ env.STATE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: maverickuser/cloud-platform-network
          ref: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'maverickuser/cloud-platform-network' && github.sha || inputs.network_ref || 'v1' }}
      - name: Install pinned Terraform
        run: |
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          curl -fsSL https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_SHA256SUMS | grep ' terraform_1.16.4_linux_amd64.zip$' | sed 's/terraform_1.16.4_linux_amd64.zip/terraform.zip/' | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && unzip -o terraform.zip terraform -d "$HOME/.local/bin" && rm terraform.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure the state bucket exists
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          # Capture the result first: with pipefail, piping a failing command into grep always fails.
          if probe=$(aws s3api head-bucket --bucket "$STATE_BUCKET" --expected-bucket-owner "$account" 2>&1); then
            echo "State bucket already exists."
          elif grep -q '(404)' <<<"$probe"; then
            echo "State bucket not found; creating it."
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "$probe"
            echo "::error::Bucket $STATE_BUCKET exists but is not owned by this account or is not accessible."
            exit 1
          fi
      - name: Terraform init
        run: terraform -chdir=network init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
      - name: Terraform plan
        run: terraform -chdir=network plan -input=false -lock-timeout=10m -var "aws_region=$AWS_REGION" -out=network.tfplan
      - name: Terraform apply
        if: ${{ inputs.apply }}
        run: terraform -chdir=network apply -input=false -lock-timeout=10m network.tfplan
