name: Destroy network
# Manual only, and only from this repository. Removes every resource in the
# network state; the state bucket itself is kept so the network can be re-created.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to remove the shared network for every service
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: shared-network
  cancel-in-progress: false
jobs:
  destroy:
    name: Destroy shared network
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      STATE_BUCKET: cloud-platform-network-terraform-state
      STATE_KEY: network/terraform.tfstate
    steps:
      - name: Require confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then echo "::error::Type destroy to confirm."; exit 1; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Terraform
        run: |
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          curl -fsSL https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_SHA256SUMS | grep ' terraform_1.16.4_linux_amd64.zip$' | sed 's/terraform_1.16.4_linux_amd64.zip/terraform.zip/' | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && unzip -o terraform.zip terraform -d "$HOME/.local/bin" && rm terraform.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        run: terraform -chdir=network init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
      - name: Terraform destroy
        run: terraform -chdir=network destroy -input=false -auto-approve -lock-timeout=10m -var "aws_region=$AWS_REGION"
